<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Castarro New Look Mocks</title>
    <style>
      :root {
        --bg: #f6f7f8;
        --surface: #ffffff;
        --surface-2: #f1f4f6;
        --ink: #171b1f;
        --muted: #66717c;
        --line: #d8dee5;
        --accent: #0f766e;
        --accent-2: #2563eb;
        --good: #16834a;
        --warn: #b7791f;
        --bad: #b42318;
        --shadow: 0 18px 48px rgba(18, 28, 38, 0.10);
        --radius: 8px;
        --font: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        line-height: 1.42;
      }

      body.control-room {
        --bg: #0d1117;
        --surface: #121821;
        --surface-2: #18212c;
        --ink: #edf3f8;
        --muted: #9aa8b6;
        --line: #273342;
        --accent: #14b8a6;
        --accent-2: #60a5fa;
        --good: #31d083;
        --warn: #f5b84b;
        --bad: #f87171;
        --shadow: 0 22px 52px rgba(0, 0, 0, 0.36);
      }

      body.clean-studio {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-2: #f2f5f7;
        --ink: #17202a;
        --muted: #68727d;
        --line: #d9e0e7;
        --accent: #006b5b;
        --accent-2: #265fbd;
        --good: #137a47;
        --warn: #a96f13;
        --bad: #b42318;
      }

      body.global-inspector {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-2: #eef3f8;
        --ink: #131a24;
        --muted: #5e6a78;
        --line: #d6dee8;
        --accent: #155e75;
        --accent-2: #7c3aed;
        --good: #15803d;
        --warn: #b45309;
        --bad: #b91c1c;
      }

      .app {
        width: min(1280px, calc(100% - 32px));
        margin: 24px auto 44px;
      }

      .topbar {
        position: sticky;
        top: 12px;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.45rem;
        letter-spacing: 0;
      }

      .brand span {
        color: var(--muted);
        font-weight: 800;
        font-size: 0.82rem;
      }

      .command-stack {
        display: flex;
        align-items: center;
        justify-content: end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .nav {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      .nav button,
      .button,
      .icon-button {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        min-height: 36px;
        padding: 8px 12px;
        font: inherit;
        font-size: 0.86rem;
        font-weight: 800;
      }

      .nav button.active,
      .button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .button.blue {
        border-color: transparent;
        background: var(--accent-2);
        color: #fff;
      }

      .button.good {
        border-color: transparent;
        background: var(--good);
        color: #fff;
      }

      .button.bad {
        border-color: transparent;
        background: var(--bad);
        color: #fff;
      }

      .layout {
        display: grid;
        grid-template-columns: 76px 260px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
        margin-top: 14px;
      }

      .clean-studio .layout {
        grid-template-columns: 270px minmax(0, 1fr);
      }

      .clean-studio .icon-rail {
        display: none;
      }

      .icon-rail,
      .channel-rail,
      .panel,
      .inspector {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .icon-rail {
        position: sticky;
        top: 90px;
        display: grid;
        gap: 8px;
        padding: 10px;
      }

      .icon-button {
        width: 54px;
        height: 48px;
        padding: 0;
        display: grid;
        place-items: center;
      }

      .icon-button.active {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .channel-rail {
        position: sticky;
        top: 90px;
        padding: 14px;
      }

      .rail-head,
      .section-head,
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      h2,
      h3,
      p {
        margin-top: 0;
      }

      h2 {
        margin-bottom: 2px;
        font-size: 1.08rem;
      }

      h3 {
        margin-bottom: 6px;
        font-size: 0.96rem;
      }

      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .channel-list {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .channel-item {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 9px;
        align-items: center;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      .channel-item.active {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--line));
        background: color-mix(in srgb, var(--accent) 11%, var(--surface));
      }

      .avatar {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--accent);
        background: var(--surface);
        font-weight: 900;
      }

      .channel-title {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .channel-title strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.9rem;
      }

      .chips {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 23px;
        border-radius: 999px;
        padding: 3px 8px;
        background: var(--surface-2);
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
      }

      .chip.good {
        color: var(--good);
        background: color-mix(in srgb, var(--good) 14%, var(--surface));
      }

      .chip.warn {
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 14%, var(--surface));
      }

      .chip.bad {
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 13%, var(--surface));
      }

      .content {
        display: grid;
        gap: 14px;
        min-width: 0;
      }

      .panel {
        padding: 18px;
        min-width: 0;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
        gap: 14px;
        min-width: 0;
      }

      .dashboard-grid > *,
      .two-col > *,
      .settings-shell > * {
        min-width: 0;
      }

      .global-inspector .dashboard-grid {
        grid-template-columns: minmax(0, 1fr) 320px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .stat {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 850;
      }

      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 1.2rem;
      }

      .preview {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background:
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255,255,255,0.04) 1px, transparent 1px),
          #05070a;
        background-size: 42px 42px;
      }

      .preview::after {
        content: "Live feed preview";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #d7dee7;
        font-weight: 900;
      }

      .meter {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 16px;
        height: 8px;
        border-radius: 999px;
        background: #2d3742;
      }

      .meter span {
        display: block;
        width: 62%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
      }

      .table {
        display: grid;
        gap: 7px;
        min-width: 0;
        overflow: hidden;
      }

      .table-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 54px 74px 90px 64px 66px;
        gap: 10px;
        align-items: center;
        min-height: 48px;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
        font-size: 0.86rem;
      }

      .table-row > * {
        min-width: 0;
      }

      .table-row strong,
      .table-row div {
        overflow-wrap: anywhere;
      }

      .table-row .button {
        width: 100%;
        padding-inline: 8px;
      }

      .table-head {
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .settings-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      .settings-tabs {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

      .tab-strip {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
        flex-wrap: wrap;
      }

      .tab-strip span {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        padding: 7px 10px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
      }

      .tab-strip span.active {
        color: #fff;
        background: var(--accent);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field,
      .mini-card {
        display: grid;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      label,
      .label {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 900;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
      }

      textarea {
        min-height: 116px;
        resize: vertical;
      }

      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(300px, 0.9fr);
        gap: 14px;
        align-items: start;
      }

      .stack {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .log-box {
        min-height: 320px;
        padding: 12px;
        border-radius: var(--radius);
        background: #05070a;
        color: #dbeafe;
        overflow: hidden;
        font-family: Consolas, "Courier New", monospace;
        font-size: 0.82rem;
      }

      .activity-line {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface-2);
      }

      .inspector {
        padding: 14px;
        display: grid;
        gap: 12px;
        min-width: 0;
        align-content: start;
      }

      .notice {
        padding: 11px 12px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        color: var(--muted);
        background: var(--surface-2);
        font-size: 0.88rem;
      }

      .control-room .topbar {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .control-room .brand::before {
        content: "ON AIR";
        align-self: center;
        border-radius: 999px;
        padding: 5px 9px;
        background: color-mix(in srgb, var(--bad) 20%, transparent);
        color: var(--bad);
        font-size: 0.72rem;
        font-weight: 950;
      }

      .control-room .stats,
      .global-inspector .stats {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .clean-studio .topbar {
        box-shadow: 0 1px 0 rgba(13, 20, 30, 0.04);
      }

      .clean-studio .panel,
      .clean-studio .channel-rail {
        box-shadow: 0 10px 28px rgba(24, 35, 48, 0.07);
      }

      .global-inspector .layout {
        grid-template-columns: 74px minmax(0, 1fr);
      }

      .global-inspector .channel-rail {
        display: none;
      }

      .global-inspector .content {
        grid-template-columns: minmax(0, 1fr);
      }

      @media (max-width: 820px) {
        .app {
          width: min(420px, calc(100% - 24px));
          margin-top: 12px;
        }

        .topbar,
        .control-room .topbar {
          position: static;
          grid-template-columns: 1fr;
        }

        .brand {
          display: grid;
          gap: 2px;
        }

        .command-stack,
        .settings-tabs,
        .row,
        .section-head {
          align-items: stretch;
          flex-direction: column;
        }

        .layout,
        .clean-studio .layout,
        .global-inspector .layout,
        .dashboard-grid,
        .global-inspector .dashboard-grid,
        .two-col,
        .form-grid,
        .stats,
        .control-room .stats,
        .global-inspector .stats {
          display: grid;
          grid-template-columns: 1fr;
        }

        .icon-rail {
          position: static;
          display: flex;
          overflow: auto;
        }

        .channel-rail {
          position: static;
        }

        .icon-button {
          flex: 0 0 54px;
        }

        .table-row {
          grid-template-columns: 1fr;
        }

        .table-head {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" id="app"></main>
    <script>
      const looks = {
        "control-room-pro": { className: "control-room", title: "Control Room Pro" },
        "clean-broadcast-studio": { className: "clean-studio", title: "Clean Broadcast Studio" },
        "global-dashboard-inspector": { className: "global-inspector", title: "Global Dashboard Inspector" },
      };

      const pages = ["dashboard", "folders", "normalize", "youtube", "live-history", "troubleshooting"];
      const params = new URLSearchParams(window.location.search);
      const lookKey = params.get("look") || "control-room-pro";
      const page = params.get("page") || "dashboard";
      const look = looks[lookKey] || looks["control-room-pro"];
      document.body.className = look.className;

      const channels = [
        { name: "Inside Us", initials: "IU", live: true, yt: "Connected", ready: "1080p", raw: 6, normalized: 6 },
        { name: "Inside Us Hindi", initials: "IH", live: false, yt: "Connected", ready: "Ready", raw: 4, normalized: 4 },
        { name: "Last Historical Moments", initials: "LH", live: false, yt: "Needs check", ready: "720p", raw: 5, normalized: 3 },
      ];

      function chip(text, tone = "") {
        return `<span class="chip ${tone}">${text}</span>`;
      }

      function button(text, tone = "") {
        return `<button class="button ${tone}" type="button">${text}</button>`;
      }

      function renderTopbar() {
        return `
          <header class="topbar">
            <div class="brand">
              <h1>Castarro</h1>
              <span>v1.1.0 - ${look.title}</span>
            </div>
            <nav class="nav" aria-label="Primary">
              <button class="${page === "dashboard" ? "active" : ""}">Dashboard</button>
              <button class="${page !== "dashboard" ? "active" : ""}">Settings</button>
            </nav>
            <div class="command-stack">
              ${chip("1 live stream", "good")}
              ${button("Start all", "good")}
              ${button("Stop all", "bad")}
            </div>
          </header>
        `;
      }

      function renderIconRail() {
        const items = [
          ["D", "dashboard"],
          ["E", "normalize"],
          ["Y", "youtube"],
          ["H", "live-history"],
          ["L", "troubleshooting"],
          ["S", "folders"],
        ];
        return `
          <aside class="icon-rail" aria-label="Sections">
            ${items.map(([icon, route]) => `<button class="icon-button ${route === page ? "active" : ""}" type="button">${icon}</button>`).join("")}
          </aside>
        `;
      }

      function renderChannelRail() {
        return `
          <aside class="channel-rail">
            <div class="rail-head">
              <h3>Channels</h3>
              ${chip("3 channels")}
            </div>
            <p class="helper">Select a channel to scope preview, scheduling, encoding, and logs.</p>
            <div class="channel-list">
              ${channels.map((channel, index) => `
                <article class="channel-item ${index === 0 ? "active" : ""}">
                  <div class="avatar">${channel.initials}</div>
                  <div class="channel-title">
                    <strong>${channel.name}</strong>
                    <div class="chips">
                      ${chip(channel.live ? "Live" : "Idle", channel.live ? "good" : "")}
                      ${chip(channel.yt, channel.yt === "Connected" ? "good" : "warn")}
                    </div>
                  </div>
                </article>
              `).join("")}
            </div>
          </aside>
        `;
      }

      function settingsTabs(active) {
        const tabs = [
          ["folders", "Folders"],
          ["normalize", "Video Encoder"],
          ["youtube", "YouTube"],
          ["live-history", "Live History"],
          ["troubleshooting", "Troubleshooting"],
        ];
        return `
          <section class="panel settings-tabs">
            <div class="tab-strip">
              ${tabs.map(([key, label]) => `<span class="${active === key ? "active" : ""}">${label}</span>`).join("")}
            </div>
            ${button("Save settings", "primary")}
          </section>
        `;
      }

      function readinessTable() {
        return `
          <div class="table">
            <div class="table-row table-head">
              <div>Channel</div><div>Raw</div><div>Encoded</div><div>YouTube</div><div>Stream</div><div>Action</div>
            </div>
            ${channels.map((channel) => `
              <div class="table-row">
                <strong>${channel.name}</strong>
                <div>${chip(String(channel.raw))}</div>
                <div>${chip(String(channel.normalized), channel.raw === channel.normalized ? "good" : "warn")}</div>
                <div>${chip(channel.yt, channel.yt === "Connected" ? "good" : "warn")}</div>
                <div>${chip(channel.live ? "Live" : "Idle", channel.live ? "good" : "")}</div>
                <div>${button(channel.live ? "Stop" : "Start", channel.live ? "bad" : "good")}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function dashboard() {
        const inspector = `
          <aside class="inspector">
            <h3>Selected Channel</h3>
            <div class="mini-card">
              <strong>Inside Us</strong>
              <div class="chips">${chip("Live", "good")}${chip("Connected", "good")}${chip("1080p")}</div>
            </div>
            ${button("Start Channel", "good")}
            ${button("Stop Channel", "bad")}
            ${button("Open YouTube Scheduler", "blue")}
            <div class="notice">Global verify passed for 2 of 3 channels. Last Historical Moments needs YouTube account confirmation.</div>
          </aside>
        `;
        return `
          <section class="panel">
            <div class="stats">
              <div class="stat"><span>Live</span><strong>1 / 3</strong></div>
              <div class="stat"><span>Ready</span><strong>2 / 3</strong></div>
              <div class="stat"><span>Encoded</span><strong>13 / 15</strong></div>
              <div class="stat"><span>YouTube</span><strong>2 linked</strong></div>
              <div class="stat"><span>Runtime</span><strong>1h 12m</strong></div>
            </div>
          </section>
          <section class="dashboard-grid">
            <div class="stack">
              <section class="panel">
                <div class="section-head">
                  <div>
                    <h2>Program Preview</h2>
                    <p class="helper">Selected channel monitor with outgoing stream state.</p>
                  </div>
                  <div class="chips">${chip("Inside Us")}${chip("Live", "good")}</div>
                </div>
                <div class="preview"><div class="meter"><span></span></div></div>
              </section>
              <section class="panel">
                <div class="section-head">
                  <div>
                    <h2>Channel Readiness</h2>
                    <p class="helper">A faster global dashboard before starting streams.</p>
                  </div>
                  ${button("Verify All Channels", "blue")}
                </div>
                ${readinessTable()}
              </section>
            </div>
            ${inspector}
          </section>
        `;
      }

      function folders() {
        return `
          ${settingsTabs("folders")}
          <section class="panel settings-shell">
            <div class="section-head">
              <div><h2>Folder Paths</h2><p class="helper">Manage local data locations used by Castarro.</p></div>
              ${chip("config.ready.json")}
            </div>
            <div class="form-grid">
              ${["Raw Videos", "Go Live", "Logs", "Playlists"].map((name) => `
                <label class="field">
                  <span>${name}</span>
                  <input value="D:\\Tools of Jawad\\17- Live Streaming via FFMPEG\\${name}">
                  <button class="button" type="button">Browse</button>
                </label>
              `).join("")}
            </div>
          </section>
        `;
      }

      function normalize() {
        return `
          ${settingsTabs("normalize")}
          <section class="panel settings-shell">
            <div class="section-head">
              <div><h2>Videos To Encode</h2><p class="helper">A compact channel-scoped encoder workspace.</p></div>
              <div class="chips">${chip("Inside Us")}${chip("6 selected", "good")}</div>
            </div>
            <div class="two-col">
              <div class="stack">
                <div class="mini-card">
                  <div class="row"><strong>Raw Videos</strong><div>${button("Add Videos", "blue")}${button("Refresh")}</div></div>
                  <div class="table">
                    ${["video-a.mp4", "video-b.mp4", "video-c.mp4"].map((file) => `
                      <div class="table-row"><strong>Raw Videos/Inside Us/${file}</strong><div>${chip("Selected", "good")}</div></div>
                    `).join("")}
                  </div>
                </div>
                <div class="mini-card">
                  <div class="row"><strong>Encoding Actions</strong><div>${button("Normalize", "good")}${button("Validate")}${button("Remove Channel", "bad")}</div></div>
                  <div class="notice">Outputs are written to Go Live/Inside Us and playlist metadata is updated after save.</div>
                </div>
              </div>
              <div class="mini-card">
                <h3>Normalization Profile</h3>
                <div class="form-grid">
                  ${["Width:1920", "Height:1080", "FPS:30", "Video bitrate:6000k", "Audio bitrate:160k", "Buffer:12000k"].map((item) => {
                    const [label, value] = item.split(":");
                    return `<label><span>${label}</span><input value="${value}"></label>`;
                  }).join("")}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function youtube() {
        return `
          ${settingsTabs("youtube")}
          <section class="panel settings-shell">
            <div class="section-head">
              <div><h2>YouTube Integration</h2><p class="helper">Connect account, schedule broadcast, and bind stream key to the selected channel.</p></div>
              ${button("Add Channel", "blue")}
            </div>
            <div class="mini-card">
              <div class="row">
                <div><strong>Inside Us</strong><p class="helper">Connected to Inside Us channel. Stream key mapping verified.</p></div>
                <div class="chips">${chip("Connected", "good")}${button("Disconnect", "bad")}</div>
              </div>
            </div>
            <div class="two-col">
              <div class="mini-card">
                <h3>Schedule Broadcast</h3>
                <div class="form-grid">
                  <label><span>Title</span><input value="Morning Worship Live - Sunday Service"></label>
                  <label><span>Start time</span><input value="06/02/2026 07:00 PM"></label>
                  <label><span>Duration</span><input value="120"></label>
                  <label><span>Privacy</span><select><option>unlisted</option></select></label>
                </div>
                <label><span>Description</span><textarea>Optional broadcast description</textarea></label>
                <div class="row">${button("Create Schedule + Stream Key", "good")}${button("Refresh Broadcasts")}</div>
              </div>
              <div class="stack">
                <div class="mini-card">
                  <h3>Channel Live Settings</h3>
                  <label><span>Manual stream key</span><input value="YT_CHANNEL_INSIDE_US_KEY"></label>
                  <label><span>YouTube Studio URL</span><input value="https://studio.youtube.com/video/live"></label>
                  <div class="chips">${chip("Loop playlist", "good")}${chip("Auto start", "good")}${chip("Auto stop", "good")}</div>
                </div>
                <div class="mini-card">
                  <h3>Videos</h3>
                  <p class="helper">Choose normalized files used by this channel.</p>
                  <div class="chips">${chip("6 videos", "good")}${button("Select All")}${button("Clear")}</div>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function liveHistory() {
        return `
          ${settingsTabs("live-history")}
          <section class="panel settings-shell">
            <div class="section-head">
              <div><h2>Live History</h2><p class="helper">Recorded sessions with fast filters and channel scope.</p></div>
              <div class="chips">${chip("4 sessions")}${chip("Total 15h 17m", "good")}</div>
            </div>
            <div class="row">
              <input value="Search title or status">
              <select><option>Last 28 days</option></select>
              ${button("Export")}
            </div>
            <div class="table">
              <div class="table-row table-head"><div>Title</div><div>Started</div><div>Ended</div><div>Status</div><div>Duration</div><div>Channel</div></div>
              ${[
                ["Morning Worship Live - Sunday Service", "Jun 2, 2026", "In progress", "Live", "1h 12m", "Inside Us"],
                ["Friday Night Teaching and Q&A", "May 29, 2026", "May 30, 2026", "Completed", "6h 23m", "Inside Us"],
                ["Community Prayer Livestream", "May 25, 2026", "May 25, 2026", "Completed", "2h 32m", "Inside Us Hindi"],
                ["Scripture Reading Continuous Stream", "May 18, 2026", "May 19, 2026", "Completed", "5h 10m", "Last Historical Moments"],
              ].map((row) => `
                <div class="table-row">
                  ${row.map((cell, index) => `<div>${index === 3 ? chip(cell, cell === "Live" ? "good" : "") : cell}</div>`).join("")}
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      function troubleshooting() {
        return `
          ${settingsTabs("troubleshooting")}
          <section class="two-col">
            <div class="panel stack">
              <div class="section-head">
                <div><h2>Activity</h2><p class="helper">Selected channel task and API events.</p></div>
                <div class="chips">${chip("All", "good")}${chip("Tasks")}${chip("API")}${chip("Errors")}</div>
              </div>
              ${[
                "Normalize completed for Inside Us with 6 output files.",
                "YouTube verification passed for Inside Us.",
                "Last Historical Moments needs account confirmation.",
                "Stream process started for Inside Us.",
              ].map((line) => `<div class="activity-line"><strong>${line}</strong><p class="helper">Today 07:04 PM - request id 8f42</p></div>`).join("")}
            </div>
            <div class="panel">
              <div class="section-head"><div><h2>Stream Logs</h2><p class="helper">Selected channel tail.</p></div>${button("Copy")}</div>
              <pre class="log-box">[ffmpeg] Opening Go Live/Inside Us/video-a.mp4
[rtmp] Connected to a.rtmp.youtube.com
[stream] packet pacing active
[youtube] signal detected
[watchdog] stream healthy
[ffmpeg] frame=129000 fps=30 bitrate=6000k</pre>
            </div>
          </section>
        `;
      }

      function renderPage() {
        const map = {
          dashboard,
          folders,
          normalize,
          youtube,
          "live-history": liveHistory,
          troubleshooting,
        };
        return (map[page] || dashboard)();
      }

      document.getElementById("app").innerHTML = `
        ${renderTopbar()}
        <section class="layout">
          ${renderIconRail()}
          ${renderChannelRail()}
          <section class="content">${renderPage()}</section>
        </section>
      `;
    </script>
  </body>
</html>
