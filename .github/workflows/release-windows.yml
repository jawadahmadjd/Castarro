name: Release Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castarro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $Package = Get-Content -Raw package.json | ConvertFrom-Json
          $Tag = "v$($Package.version)"
          $Existing = git ls-remote --tags origin "refs/tags/$Tag"
          $Exists = if ([string]::IsNullOrWhiteSpace($Existing)) { "false" } else { "true" }
          "version=$($Package.version)" >> $env:GITHUB_OUTPUT
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "exists=$Exists" >> $env:GITHUB_OUTPUT

      - name: Skip existing release
        if: steps.version.outputs.exists == 'true'
        shell: pwsh
        run: |
          Write-Host "::notice::Release ${{ steps.version.outputs.tag }} already exists. Bump package.json version to publish another auto-update."

      - name: Generate app icon
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run icon

      - name: Bundle Python and FFmpeg runtimes
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run bundle:runtime

      - name: Detect signing configuration
        if: steps.version.outputs.exists != 'true'
        id: signing
        shell: pwsh
        run: |
          $HasLink = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $HasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD) -or -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          $Enabled = $HasLink -and $HasPassword
          "enabled=$($Enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($Enabled) {
            Write-Host "::notice::Windows signing is enabled for this release."
          } else {
            Write-Host "::warning::Windows signing is not configured. Building unsigned installer (download warnings expected)."
          }

      - name: Validate signing configuration
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/assert_windows_signing.ps1

      - name: Build signed installer and update metadata
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: npm run dist:signed

      - name: Build unsigned installer and update metadata
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: npm run dist

      - name: Verify installer signature
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_windows_signature.ps1 `
            -Path "dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Smoke-test packaged app
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run smoke:packaged

      - name: Smoke-test Windows installer
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run smoke:installer

      - name: Create version tag
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Castarro ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Castarro ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe
            dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
