name: Release Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: castarro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      android_signing_enabled: ${{ steps.version.outputs.android_signing_enabled }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: pwsh
        env:
          CASTARRO_ANDROID_KEYSTORE_BASE64: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_BASE64 }}
          CASTARRO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_PASSWORD }}
          CASTARRO_ANDROID_KEY_ALIAS: ${{ secrets.CASTARRO_ANDROID_KEY_ALIAS }}
          CASTARRO_ANDROID_KEY_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEY_PASSWORD }}
        run: |
          $Package = Get-Content -Raw package.json | ConvertFrom-Json
          $Version = [string]$Package.version
          if ($Version -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:[-+].*)?$') {
            throw "package.json version '$Version' must start with semantic version major.minor.patch for Android versionCode generation."
          }

          $Major = [int]$Matches.major
          $Minor = [int]$Matches.minor
          $Patch = [int]$Matches.patch
          $AndroidVersionCode = ($Major * 1000000) + ($Minor * 1000) + $Patch
          $Tag = "v$Version"
          $Existing = git ls-remote --tags origin "refs/tags/$Tag"
          $Exists = if ([string]::IsNullOrWhiteSpace($Existing)) { "false" } else { "true" }
          $AndroidSecretNames = @(
            "CASTARRO_ANDROID_KEYSTORE_BASE64",
            "CASTARRO_ANDROID_KEYSTORE_PASSWORD",
            "CASTARRO_ANDROID_KEY_ALIAS",
            "CASTARRO_ANDROID_KEY_PASSWORD"
          )
          $MissingAndroidSecrets = @(
            foreach ($Name in $AndroidSecretNames) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($Name))) {
                $Name
              }
            }
          )
          $AndroidSigningEnabled = $MissingAndroidSecrets.Count -eq 0

          "version=$Version" >> $env:GITHUB_OUTPUT
          "android_version_code=$AndroidVersionCode" >> $env:GITHUB_OUTPUT
          "android_signing_enabled=$($AndroidSigningEnabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$Tag" >> $env:GITHUB_OUTPUT
          "exists=$Exists" >> $env:GITHUB_OUTPUT

          if ($Exists -eq "true") {
            Write-Host "::notice::Release $Tag already exists. Bump package.json version to publish another auto-update."
          }
          if (-not $AndroidSigningEnabled) {
            Write-Host "::warning::Missing Android release signing secret(s): $($MissingAndroidSecrets -join ' '). Skipping Android APK for this release; Windows release can still publish."
          }

  android-release-apk:
    name: Build signed Android release APK
    needs: prepare
    if: false # Temporarily disabled mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/CastarroMobile
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate Android signing secrets
        shell: bash
        env:
          CASTARRO_ANDROID_KEYSTORE_BASE64: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_BASE64 }}
          CASTARRO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_PASSWORD }}
          CASTARRO_ANDROID_KEY_ALIAS: ${{ secrets.CASTARRO_ANDROID_KEY_ALIAS }}
          CASTARRO_ANDROID_KEY_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CASTARRO_ANDROID_KEYSTORE_BASE64 \
            CASTARRO_ANDROID_KEYSTORE_PASSWORD \
            CASTARRO_ANDROID_KEY_ALIAS \
            CASTARRO_ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android release signing secret(s): ${missing[*]}. Configure these repository secrets before publishing a GitHub Release with an APK."
            exit 1
          fi

      - name: Write Android signing config
        shell: bash
        env:
          CASTARRO_ANDROID_KEYSTORE_BASE64: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_BASE64 }}
          CASTARRO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEYSTORE_PASSWORD }}
          CASTARRO_ANDROID_KEY_ALIAS: ${{ secrets.CASTARRO_ANDROID_KEY_ALIAS }}
          CASTARRO_ANDROID_KEY_PASSWORD: ${{ secrets.CASTARRO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/castarro-release.jks"
          printf '%s' "$CASTARRO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          cat > keystore.properties <<EOF
          storeFile=$keystore_path
          storePassword=$CASTARRO_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$CASTARRO_ANDROID_KEY_ALIAS
          keyPassword=$CASTARRO_ANDROID_KEY_PASSWORD
          EOF

      - name: Run Android unit tests
        run: |
          ./gradlew :app:testReleaseUnitTest --no-daemon \
            -PcastarroVersionName=${{ needs.prepare.outputs.version }} \
            -PcastarroVersionCode=${{ needs.prepare.outputs.android_version_code }}

      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PcastarroVersionName=${{ needs.prepare.outputs.version }} \
            -PcastarroVersionCode=${{ needs.prepare.outputs.android_version_code }}

      - name: Stage Android release asset
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Castarro-Android-$version.apk"
          sha256sum "release-artifacts/Castarro-Android-$version.apk" > "release-artifacts/Castarro-Android-$version.apk.sha256"

      - name: Upload Android release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: castarro-android-release-apk
          path: mobile/android/CastarroMobile/release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release-linux:
    name: Build Linux deb release
    needs: prepare
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ffmpeg

      - name: Install node dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run icon

      - name: Create YouTube OAuth seed
        shell: bash
        env:
          CASTARRO_YOUTUBE_CLIENT_ID: ${{ secrets.CASTARRO_YOUTUBE_CLIENT_ID }}
          CASTARRO_YOUTUBE_CLIENT_SECRET: ${{ secrets.CASTARRO_YOUTUBE_CLIENT_SECRET }}
          CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE: ${{ secrets.CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE }}
          CASTARRO_YOUTUBE_REDIRECT_URI: ${{ secrets.CASTARRO_YOUTUBE_REDIRECT_URI }}
        run: |
          if [ -n "$CASTARRO_YOUTUBE_CLIENT_ID" ] && [ -n "$CASTARRO_YOUTUBE_CLIENT_SECRET" ]; then
            mkdir -p desktop/resources/seed-data
            cat > desktop/resources/seed-data/youtube.oauth.seed.json <<EOF
          {
            "youtube": {
              "client_id": "$CASTARRO_YOUTUBE_CLIENT_ID",
              "client_secret": "$CASTARRO_YOUTUBE_CLIENT_SECRET",
              "oauth_client_type": "${CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE:-desktop}",
              "use_pkce": true,
              "redirect_uri": "${CASTARRO_YOUTUBE_REDIRECT_URI:-http://127.0.0.1:8765/api/youtube/oauth/callback}",
              "scopes": [
                "https://www.googleapis.com/auth/youtube",
                "https://www.googleapis.com/auth/youtube.force-ssl"
              ]
            }
          }
          EOF
          fi

      - name: Prepare resource directories
        run: |
          mkdir -p desktop/resources/python desktop/resources/ffmpeg desktop/resources/seed-data
          touch desktop/resources/python/.keep desktop/resources/ffmpeg/.keep desktop/resources/seed-data/.keep

      - name: Build Linux deb and AppImage
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Stage Linux release assets
        shell: bash
        run: |
          mkdir -p linux-artifacts
          cp dist/Castarro-*.deb linux-artifacts/ 2>/dev/null || cp dist/*.deb linux-artifacts/ 2>/dev/null || true
          cp dist/Castarro-*.AppImage linux-artifacts/ 2>/dev/null || cp dist/*.AppImage linux-artifacts/ 2>/dev/null || true
          if [ -f dist/latest-linux.yml ]; then
            cp dist/latest-linux.yml linux-artifacts/
          fi

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: castarro-linux-release-deb
          path: linux-artifacts/*
          if-no-files-found: error
          retention-days: 1


  release:
    name: Build and publish release
    needs:
      - prepare
      - android-release-apk
      - release-linux
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.exists != 'true' && (needs.android-release-apk.result == 'success' || needs.android-release-apk.result == 'skipped') && (needs.release-linux.result == 'success' || needs.release-linux.result == 'skipped')
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use prepared release version
        id: version
        shell: pwsh
        run: |
          "version=${{ needs.prepare.outputs.version }}" >> $env:GITHUB_OUTPUT
          "android_version_code=${{ needs.prepare.outputs.android_version_code }}" >> $env:GITHUB_OUTPUT
          "android_signing_enabled=${{ needs.prepare.outputs.android_signing_enabled }}" >> $env:GITHUB_OUTPUT
          "tag=${{ needs.prepare.outputs.tag }}" >> $env:GITHUB_OUTPUT
          "exists=${{ needs.prepare.outputs.exists }}" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron build tools
        if: steps.version.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-tools-${{ runner.os }}-

      - name: Cache Runtime archives (FFmpeg & Python)
        if: steps.version.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .runtime/package-cache
            desktop/resources/python
            desktop/resources/ffmpeg
          key: runtime-cache-${{ runner.os }}-${{ hashFiles('scripts/package_runtime.ps1') }}
          restore-keys: |
            runtime-cache-${{ runner.os }}-

      - name: Generate app icon
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run icon

      - name: Bundle Python and FFmpeg runtimes
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run bundle:runtime

      - name: Create YouTube OAuth seed
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          CASTARRO_YOUTUBE_CLIENT_ID: ${{ secrets.CASTARRO_YOUTUBE_CLIENT_ID }}
          CASTARRO_YOUTUBE_CLIENT_SECRET: ${{ secrets.CASTARRO_YOUTUBE_CLIENT_SECRET }}
          CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE: ${{ secrets.CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE }}
          CASTARRO_YOUTUBE_REDIRECT_URI: ${{ secrets.CASTARRO_YOUTUBE_REDIRECT_URI }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CASTARRO_YOUTUBE_CLIENT_ID)) {
            throw "CASTARRO_YOUTUBE_CLIENT_ID is not configured. Refusing to publish an installer with missing YouTube owner OAuth credentials."
          }
          if ([string]::IsNullOrWhiteSpace($env:CASTARRO_YOUTUBE_CLIENT_SECRET)) {
            throw "CASTARRO_YOUTUBE_CLIENT_SECRET is not configured. This OAuth client requires a secret during token exchange."
          }

          $SeedDir = "desktop/resources/seed-data"
          New-Item -ItemType Directory -Force -Path $SeedDir | Out-Null
          $Payload = @{
            youtube = @{
              client_id = $env:CASTARRO_YOUTUBE_CLIENT_ID
              client_secret = $env:CASTARRO_YOUTUBE_CLIENT_SECRET
              oauth_client_type = if ([string]::IsNullOrWhiteSpace($env:CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE)) { "desktop" } else { $env:CASTARRO_YOUTUBE_OAUTH_CLIENT_TYPE }
              use_pkce = $true
              redirect_uri = if ([string]::IsNullOrWhiteSpace($env:CASTARRO_YOUTUBE_REDIRECT_URI)) { "http://127.0.0.1:8765/api/youtube/oauth/callback" } else { $env:CASTARRO_YOUTUBE_REDIRECT_URI }
              scopes = @(
                "https://www.googleapis.com/auth/youtube",
                "https://www.googleapis.com/auth/youtube.force-ssl"
              )
            }
          }
          $Payload | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 -Path "$SeedDir/youtube.oauth.seed.json"

      - name: Detect signing configuration
        if: steps.version.outputs.exists != 'true'
        id: signing
        shell: pwsh
        run: |
          $WinCscLink = '${{ secrets.WIN_CSC_LINK }}'
          $CscLink = '${{ secrets.CSC_LINK }}'
          $WinCscPassword = '${{ secrets.WIN_CSC_KEY_PASSWORD }}'
          $CscPassword = '${{ secrets.CSC_KEY_PASSWORD }}'
          $HasLink = -not [string]::IsNullOrWhiteSpace($WinCscLink) -or -not [string]::IsNullOrWhiteSpace($CscLink)
          $HasPassword = -not [string]::IsNullOrWhiteSpace($WinCscPassword) -or -not [string]::IsNullOrWhiteSpace($CscPassword)
          $Enabled = $HasLink -and $HasPassword
          "enabled=$($Enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($Enabled) {
            Write-Host "::notice::Windows signing is enabled for this release."
          } else {
            Write-Host "::warning::Windows signing is not configured. Building unsigned installer (download warnings expected)."
          }

      - name: Validate signing configuration
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/assert_windows_signing.ps1

      - name: Build signed installer and update metadata
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            npm run dist:signed
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($Attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Write-Warning "Signed build failed on attempt $Attempt. Cleaning dist and retrying."
            if (Test-Path -LiteralPath "dist") {
              Remove-Item -LiteralPath "dist" -Recurse -Force
            }
            Start-Sleep -Seconds (15 * $Attempt)
          }

      - name: Build unsigned installer and update metadata
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          # Prevent electron-builder from treating empty signing env vars as invalid certificate paths.
          Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            npm run dist
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($Attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Write-Warning "Unsigned build failed on attempt $Attempt. Cleaning dist and retrying."
            if (Test-Path -LiteralPath "dist") {
              Remove-Item -LiteralPath "dist" -Recurse -Force
            }
            Start-Sleep -Seconds (15 * $Attempt)
          }

      - name: Verify installer signature
        if: steps.version.outputs.exists != 'true' && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_windows_signature.ps1 `
            -Path "dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Smoke-test packaged app
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke_packaged.ps1 -RequireYoutubeCredentials

      - name: Smoke-test Windows installer
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: npm run smoke:installer

      - name: Download Linux release deb
        if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: castarro-linux-release-deb
          path: dist

      - name: Create version tag
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Castarro ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Castarro ${{ steps.version.outputs.version }}
          body: |
            ## Downloads

            - **Windows Desktop**: `Castarro-Setup-${{ steps.version.outputs.version }}.exe`
            - **Ubuntu / Linux Installer (.deb)**: `Castarro-Setup-${{ steps.version.outputs.version }}.deb`

            The `.deb` package installs natively on Ubuntu / Debian with automatic desktop shortcuts and system dependency integration.
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe
            dist/Castarro-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            dist/latest.yml
            dist/Castarro-*.deb
            dist/Castarro-*.AppImage
            dist/latest-linux.yml

